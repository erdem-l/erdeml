{{- /* Spotify embed. Usage: {{< spotify type="episode" id="..." >}} */ -}}
{{- $type := .Get "type" | default "episode" -}}
{{- $id := .Get "id" -}}
<iframe style="border-radius:12px" width="100%" height="152" frameborder="0" loading="lazy"
  title="Spotify player" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
  src="https://open.spotify.com/embed/{{ $type }}/{{ $id }}"></iframe>
