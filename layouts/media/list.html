{{ define "main" }}
<div class="el-page">
  <header class="el-head">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="el-intro">{{ . }}</div>{{ end }}
  </header>
  {{ $pages := .Pages.ByDate.Reverse }}
  {{ partial "erdem/year-toc" (dict "pages" $pages "prefix" "m") }}
  {{ partial "erdem/by-year" (dict "pages" $pages "item" "erdem/media-item" "prefix" "m") }}
</div>
{{ end }}
